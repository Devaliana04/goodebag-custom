<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="100%" height="100%">
  <defs>
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e8c3b"/>
      <stop offset="100%" stop-color="#2c5a23"/>
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7fb56e"/>
      <stop offset="100%" stop-color="#3b6e2d"/>
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfcbaf"/>
      <stop offset="100%" stop-color="#cbb18e"/>
    </linearGradient>
  </defs>

  <!-- ICON GROUP -->
  <g transform="translate(10, 10)">
    <!-- Small background leaves / branches -->
    <path d="M 28 55 C 20 45, 12 50, 18 62 C 24 70, 32 62, 28 55 Z" fill="#7fa674" opacity="0.9"/>
    <path d="M 12 70 C 5 65, 2 73, 8 80 C 14 86, 18 78, 12 70 Z" fill="#8cb382" opacity="0.85"/>
    <path d="M 105 45 C 112 36, 118 42, 114 52 C 109 60, 102 54, 105 45 Z" fill="#8cb382" opacity="0.9"/>
    <path d="M 112 60 C 120 54, 124 63, 118 70 C 112 76, 108 68, 112 60 Z" fill="#7fa674" opacity="0.85"/>

    <!-- Bag Handle -->
    <path d="M 45 52 C 45 28, 75 28, 75 52" fill="none" stroke="#24481c" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M 45 52 C 45 32, 75 32, 75 52" fill="none" stroke="#cbb18e" stroke-width="3" stroke-linecap="round"/>

    <!-- Bag Body -->
    <path d="M 33 50 L 87 50 C 93 50, 97 54, 95 62 L 88 106 C 86 114, 80 118, 72 118 L 48 118 C 40 118, 34 114, 32 106 L 25 62 C 23 54, 27 50, 33 50 Z" 
          fill="url(#bagGrad)" stroke="#24481c" stroke-width="5.5" stroke-linejoin="round"/>
    
    <!-- Bag Stitching -->
    <path d="M 35 56 L 85 56" fill="none" stroke="#9a7b52" stroke-width="1.8" stroke-dasharray="3,2.5"/>

    <!-- Big Leaf 1 (Left wrap) -->
    <path d="M 20 85 C 15 55, 38 42, 48 65 C 55 78, 42 108, 30 112 C 22 105, 20 95, 20 85 Z" 
          fill="url(#leafGrad1)" stroke="#24481c" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M 23 88 C 30 75, 40 68, 45 68" fill="none" stroke="#97c488" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Big Leaf 2 (Center forward leaf) -->
    <path d="M 42 115 C 38 95, 42 75, 78 52 C 92 78, 88 105, 70 116 C 58 122, 46 120, 42 115 Z" 
          fill="url(#leafGrad2)" stroke="#24481c" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M 43 115 C 52 95, 65 78, 76 56" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <path d="M 58 92 C 68 90, 76 96, 78 98" fill="none" stroke="#c2e3b5" stroke-width="2" stroke-linecap="round"/>
    <path d="M 64 80 C 72 78, 78 82, 80 84" fill="none" stroke="#c2e3b5" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- TYPOGRAPHY: "Goodebag" -->
  <g transform="translate(142, 98)">
    <!-- "Goode" part in deep olive/forest green #436d2c -->
    <!-- G -->
    <text x="0" y="0" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#477332" letter-spacing="-1.5">G</text>
    <!-- o -->
    <text x="46" y="0" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="64" font-weight="750" fill="#477332" letter-spacing="-1">o</text>
    <!-- o -->
    <text x="83" y="0" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="64" font-weight="750" fill="#477332" letter-spacing="-1">o</text>
    <!-- d with sprout on top -->
    <text x="120" y="0" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="64" font-weight="750" fill="#477332" letter-spacing="-1">d</text>
    <!-- Leaves on 'd' stem -->
    <path d="M 149 -42 C 145 -54, 137 -55, 135 -48 C 133 -40, 143 -40, 149 -42 Z" fill="#588e3f"/>
    <path d="M 152 -43 C 158 -55, 166 -54, 166 -46 C 166 -38, 156 -39, 152 -43 Z" fill="#588e3f"/>

    <!-- e -->
    <text x="158" y="0" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="64" font-weight="750" fill="#477332" letter-spacing="-1">e</text>

    <!-- "bag" part in warm craft brown #916943 -->
    <!-- b -->
    <text x="195" y="0" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="64" font-weight="750" fill="#916943" letter-spacing="-1">b</text>
    <!-- a -->
    <text x="233" y="0" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="64" font-weight="750" fill="#916943" letter-spacing="-1">a</text>
    <!-- Leaf on top right of 'g' -->
    <path d="M 298 -35 C 304 -48, 316 -46, 316 -38 C 316 -30, 305 -30, 298 -35 Z" fill="#9e744d"/>

    <!-- "CUSTOM" Badge -->
    <g transform="translate(330, -38)">
      <rect width="136" height="36" rx="8" fill="#E9F7FF" stroke="#096EA7" stroke-width="2.5"/>
      <text x="68" y="25" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="19" font-weight="800" fill="#096EA7" letter-spacing="2.5">CUSTOM</text>
    </g>
  </g>
</svg>
